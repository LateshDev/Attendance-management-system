version: '3.8'

services:
  web:
    build: .
    container_name: attendance_web
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=production-secure-random-secret-key-replace-in-env
      - DATABASE_URL=postgresql://postgres:postgrespassword@db:5432/attendance_db
      - PORT=5000
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - app_uploads:/app/instance/uploads

  db:
    image: postgres:16-alpine
    container_name: attendance_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=attendance_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d attendance_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  app_uploads:
